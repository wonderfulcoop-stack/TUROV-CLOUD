name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-webview/**"
      - ".github/workflows/main.yml"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate Android launcher icons
        working-directory: android-webview
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("app-icon.png")
          if not src.exists():
              raise SystemExit("app-icon.png not found in android-webview")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          img = Image.open(src).convert("RGBA")

          for folder, size in sizes.items():
              out_dir = Path("app/src/main/res") / folder
              out_dir.mkdir(parents=True, exist_ok=True)

              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(out_dir / "ic_launcher.png")
              resized.save(out_dir / "ic_launcher_round.png")

          print("Launcher icons generated")
          PY

      - name: Build debug APK
        working-directory: android-webview
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurovCloud-debug-apk
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
