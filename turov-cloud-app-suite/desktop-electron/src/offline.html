<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Turov Cloud — offline</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#222 0,#050505 45%,#000 100%);color:#fff;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:32px;background:rgba(255,255,255,.045);box-shadow:0 20px 80px rgba(0,0,0,.55);text-align:center}.logo{width:72px;height:72px;object-fit:contain;margin-bottom:18px;filter:drop-shadow(0 0 24px rgba(255,255,255,.22))}h1{font-size:28px;margin:0 0 10px}p{color:#bbb;line-height:1.55;margin:0 0 22px}button{border:0;border-radius:18px;padding:14px 20px;background:#fff;color:#000;font-weight:800;cursor:pointer;width:100%;font-size:15px}button:hover{transform:translateY(-1px)}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../assets/logo.png" alt="Turov Cloud" />
    <h1>Нет соединения</h1>
    <p>Приложение не смогло открыть Turov Cloud. Проверь интернет или доступность сайта и попробуй снова.</p>
    <button onclick="window.TurovCloudApp?.reload?.()">Повторить подключение</button>
  </div>
</body>
</html>
